<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopFlow · 管理页本地预览</title><link rel="stylesheet" href="/manager.css"><style>
body{--dark-bg-color:#1f2937;--dark-text-color:rgba(255,255,255,1);--dark-card-bg:#00000024;--dark-btn-color:hsl(201 100% 30.5% / 25.2%);--dark-btn-color-active:hsl(201 100% 50.5% / 45.2%);margin:0;padding:24px;background:var(--dark-bg-color);color:var(--dark-text-color);text-shadow:-1px -1px 10px rgba(0,0,0,.3);font-weight:bold;word-break:break-all;font:14px/1.6 system-ui,sans-serif}html[data-theme="light"] body{--dark-bg-color:#edf2f8;--dark-text-color:#28364c;--dark-card-bg:#ffffff;--dark-btn-color:#dbeaf3;--dark-btn-color-active:#b9d8ec}button{backdrop-filter:blur(10px);text-shadow:inherit}.preview-controls{position:relative;z-index:2147483001;display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:max-content;max-width:calc(100% - 32px);padding:10px 14px;margin:0 auto;border:1px solid #8392ac55;border-radius:12px;background:#1b2638;color:#e2eaf8;font-size:12px}.preview-controls button,.preview-controls select{font:inherit;border:1px solid #7185a944;border-radius:7px;background:#33415a;color:white;padding:5px 10px}.preview-caption{margin:50px auto;text-align:center;max-width:560px}.preview-receipt{position:fixed;bottom:12px;left:16px;right:16px;z-index:2147483001;pointer-events:none;text-align:center;font-size:11px;color:#8395b0}html[data-preview-clean] .preview-controls,html[data-preview-clean] .preview-receipt,html[data-preview-clean] .preview-caption{display:none}
html[data-preview-mobile] .container{width:360px;max-width:100%;margin:0 auto} .functions-container button{padding:9px 13px;border:0;border-radius:8px;background:#19455e;color:#dcebf4;font:600 13px system-ui} .container{max-width:1440px;margin:auto}</style></head><body><aside class="preview-controls"><strong>电脑预览 · 无设备连接</strong><select id="scenario" aria-label="预览状态"><option value="custom">插件运行中</option><option value="factory">原厂运行中</option><option value="new">尚未安装</option><option value="update">可更新组件</option><option value="failure">恢复异常</option><option value="offline">读取失败</option></select><button id="open">打开管理页</button></aside><div class="container"><div class="functions-container"><h2>功能列表</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button">插件功能</button><button type="button">短信收发</button><button type="button">Wi-Fi 设置</button><button type="button">主题背景</button></div></div></div><div class="preview-receipt" id="receipt">电脑预览，不连接设备。此预览工具不会进入安装 TXT。</div><script src="/host.js"></script><script src="/manager-theme.js"></script><script src="/manager-confirm.js"></script><script src="/manager-wallpaper.js"></script><script src="/manager-wallpaper-ui.js"></script><script src="/manager-wallpaper-migration.js"></script><script src="/manager-plugin.js"></script></body></html>
